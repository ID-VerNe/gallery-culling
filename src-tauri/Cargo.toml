[package]
name = "gallery-culling"
version = "1.0.0"
description = "Fast Photo Culling & RAW+JPG Selector Desktop Tool"
authors = ["ID-VerNe"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gallery_culling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = true
# thin LTO：链接期优化可跨 codegen unit 并行，发版编译时间大幅缩短，
# 代价是优化略弱于 fat LTO（产物体积/性能差异通常很小）。
lto = "thin"
# 与 thin LTO 配套：放开 codegen unit 数，让 20 核真正吃满并行度。
# 配合 thin LTO，跨 unit 内联仍可进行，优化质量损失有限。
codegen-units = 16

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "6.1"
ab_glyph = "0.2"
kamadak-exif = "0.6"
rusqlite = { version = "0.33", features = ["bundled"] }
trash = "5.2"
rayon = "1.10"
sha2 = "0.10"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"] }
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
